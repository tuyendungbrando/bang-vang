<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brando Growth</title>
<!-- Biểu tượng khi thêm vào màn hình chính -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brando Growth">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F7F2EA">
<style>
  html,body{margin:0;height:100%;background:#F7F2EA}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;
    padding-top:env(safe-area-inset-top);box-sizing:border-box;background:transparent}
  .cho{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    font:500 14px/1.4 -apple-system,system-ui,sans-serif;color:#8B7B70}
  .cho img{width:88px;height:88px;border-radius:20px;box-shadow:0 6px 20px rgba(42,32,27,.18)}
</style>
</head>
<body>
<div class="cho"><img src="apple-touch-icon.png" alt=""><span>Đang tải Bảng Vàng…</span></div>
<!-- Bảng Vàng thật (Google Apps Script) hiện bên trong trang này -->
<iframe src="https://script.google.com/macros/s/AKfycbwmv6qEafQQpHi4W9tMKDs2X2mnxV9wTEqob0VZKglHxtEHcrrgPkm2_o2maJ4tO8l1/exec"
        title="Bảng Vàng BRANDO GROWTH" allow="clipboard-write"></iframe>
<script>
/* 11/11/2026: giữ hộ đăng nhập Bảng Vàng trên điện thoại (iPhone hay xoá bộ nhớ của khung Google bên trong).
   Chỉ nói chuyện với khung Bảng Vàng (googleusercontent.com). */
addEventListener("message", function (e) {
  try {
    if (!/\.googleusercontent\.com$/.test(new URL(e.origin).hostname)) return;
    var d = e.data || {};
    if (d.bg === "xin-ma") e.source.postMessage({ bg: "ma", v: localStorage.getItem("bg-ma") || "" }, e.origin);
    else if (d.bg === "luu-ma") { d.v ? localStorage.setItem("bg-ma", d.v) : localStorage.removeItem("bg-ma"); }
  } catch (x) {}
});
</script>
</body>
</html>
